[project]
name = "korean-doc-rag"
version = "0.1.0"
description = "Korean document QA with hybrid retrieval and a LangGraph verify-retry loop"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "anthropic>=0.40",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "kiwipiepy>=0.18",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "tqdm>=4.66",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "langchain-text-splitters>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
ocr = ["easyocr>=1.7"]  # 스캔 PDF·이미지 — 한국어 인식, torch 공유

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kdr"]

[tool.ruff]
line-length = 100
target-version = "py311"
